<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standard Algorithm Subtraction</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18253a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:20px}.app{max-width:640px;margin:auto}
h1{font-size:clamp(22px,4vw,30px);margin:0 0 6px;text-align:center}.sub{color:#5e6d81;font-size:14px;text-align:center;margin:0 auto 6px;max-width:460px}
.card{background:#fff;border:1px solid #d9e1eb;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #152b4310}
.tray{display:flex;gap:14px;justify-content:center;align-items:center;min-height:84px;border:2px dashed #afbed1;border-radius:14px;padding:10px;color:#8491a2;font-size:14px}
.tray.over,.cells.over{border-color:#5144c6;background:#f0eefc}
.plus{font-size:40px;font-weight:800;color:#5e6d81;line-height:1}
.tray.arrow{font-size:34px;color:#afbed1}
.tile{font-size:34px;font-weight:800;padding:10px 20px;border:2px solid #5144c6;background:#fff;color:#18253a;border-radius:12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px #5144c622}
.tile:focus-visible,.slot:focus-visible{outline:3px solid #7268e4;outline-offset:2px}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;margin:0}
.frame{display:flex;flex-direction:column;align-items:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center}
.sg{width:40px;text-align:center;font-size:38px;font-weight:700;color:#5e6d81}
.cells{display:flex;border:2px solid transparent;border-radius:12px}
.cells.empty{border-color:#afbed1;border-style:dashed;min-height:68px}
.slot[role=button]{cursor:grab;touch-action:none}
.c{width:90px;height:68px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;border-radius:10px}
.c.act{background:#eeeafe}
.row.cr .c{height:44px}
.row.top,.row.bot{margin:5px 0}
.row.bot .cells{border-bottom:4px solid #18253a;border-radius:0 0 4px 4px;padding-bottom:2px}
.row.bot .cells.empty{border-radius:12px;padding:0}
.row.ar{margin-top:8px}
.abox,.afix{width:56px;height:62px;font-size:38px;font-weight:800;text-align:center;border-radius:10px;font-family:inherit;padding:0}
.abox{border:3px solid #5144c6;background:#fff;color:#18253a}
.abox:focus{outline:3px solid #b6aef5;outline-offset:1px}
.afix{display:flex;align-items:center;justify-content:center;border:3px solid #2e9e62;background:#f1faf5}
.afix.wait{border:2px dashed #cdd6e2;background:transparent}
.cbox,.cfix{width:38px;height:38px;font-size:22px;font-weight:800;text-align:center;border-radius:8px;font-family:inherit;padding:0}
.cbox{border:2px solid #e08a1e;background:#fff8ee;color:#18253a}
.cbox:focus{outline:3px solid #f6cf9c;outline-offset:1px}
.cfix{display:flex;align-items:center;justify-content:center;border:2px solid #e08a1e;background:#fff8ee;color:#a35d0b}
.msg{text-align:center;min-height:26px;font-weight:700;margin-top:10px;color:#bb3d3d}.msg.good{color:#18845a;font-size:18px}
.help{text-align:center;color:#5e6d81;font-size:14px;margin-top:8px}
.next{display:block;margin:6px auto 0;border:0;border-radius:10px;background:#5144c6;color:#fff;font-weight:700;font-size:16px;padding:12px 20px;cursor:pointer}
.title2{text-align:center;font-weight:700;margin:0 0 10px}
@media(max-width:400px){.c{width:68px}.sg{width:30px}.tile{font-size:28px;padding:8px 14px}.abox,.afix{width:48px}}

.c{position:relative}
.num{position:relative;display:inline-flex;align-items:flex-start;gap:8px}
.pb,.pbi{width:28px;height:28px;font-size:18px;font-weight:800;text-align:center;border-radius:7px;font-family:inherit;padding:0;align-self:flex-start;margin-top:5px;flex:none}
.pb{display:flex;align-items:center;justify-content:center;border:2px solid #e08a1e;background:#fff8ee;color:#a35d0b}
.pb.st{opacity:.45}
.pbi{border:2px solid #e08a1e;background:#fff;color:#18253a}
.pbi:focus,.cbox:focus{outline:3px solid #f6cf9c;outline-offset:1px}
.dg{position:relative;display:inline-block;line-height:1}
.dg.tap{cursor:pointer;padding:2px 5px;margin:0 -5px;border-radius:12px;background:#f3f1ff;outline:2px dashed #b4abf0;outline-offset:1px}
.hand{font-size:30px;line-height:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(5px)}}
.dg.strike{color:#9aa6b6}
.num.strike::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;border-top:4px solid #d33;border-radius:2px;transform:rotate(20deg);pointer-events:none}
@media(max-width:400px){.pb,.pbi{width:24px;height:24px;font-size:16px}.num{gap:5px}}
.dg.nudge{animation:pulse 0.7s ease-in-out 3;border-radius:10px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #e08a1e00;background:transparent}50%{box-shadow:0 0 0 8px #e08a1e55;background:#fff1de}}
.wig{animation:wig .4s}
.shake{animation:wig .4s}
@keyframes wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.cells.empty.wig{border-color:#d05050}
</style>
</head>
<body><main class="app">
<h1>Standard Algorithm: Subtraction</h1>
<p class="sub" id="instr"></p>
<section class="card">
 <div id="trayWrap"><div class="tray" id="tray" data-drop="stage"></div></div>
 <div class="frame" id="frame"></div>
 <div class="msg" id="msg" role="status" aria-live="polite"></div>
 <div class="help" id="help"></div>
</section>
<button class="next" id="next" type="button">New problem &#8635;</button>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
let tapUsed=false,nums=[85,47],place=['stage','stage'],ans=[],loan={},lowVal={},tenDone={},pend=null,nudge=false,wigSlot=null,wigCol=null,suppress=false;
const dig=(x,k)=>{const s=String(x);return k<s.length?+s[s.length-1-k]:null};
const slotIdx=w=>place.indexOf(w);
const locked=()=>ans.some(v=>v!==undefined)||Object.keys(loan).length>0;
function model(){
 const ti=slotIdx('top'),bi=slotIdx('bottom'),placed=ti>=0&&bi>=0;
 const top=ti>=0?nums[ti]:null,bot=bi>=0?nums[bi]:null;
 const maxd=String(Math.max(nums[0],nums[1])).length;
 const resLen=placed?String(top-bot).length:0;
 const e=j=>(dig(top,j)||0)-(loan[j]?1:0)+(loan[j+1]?10:0);
 const b=j=>dig(bot,j)||0;
 let cur=null;if(placed){for(let c=0;c<resLen;c++){if(ans[c]===undefined){cur=c;break;}}}
 const need=cur!==null&&e(cur)<b(cur);
 let allowed=null;if(need){for(let t=cur+1;t<maxd;t++){if(e(t)>0){allowed=t;break;}}}
 return {placed,top,bot,maxd,resLen,e,b,cur,need,allowed};
}
function render(){
 const m=model(),isLocked=locked(),finished=m.placed&&m.cur===null;
 $('instr').textContent=!m.placed?'Drag each number into the boxes. The bigger number goes on top.':'';
 const tray=$('tray');tray.innerHTML='';$('trayWrap').hidden=isLocked||m.placed;
 nums.forEach((v,i)=>{if(place[i]!=='stage')return;
  if(place[0]==='stage'&&place[1]==='stage'&&i===1){const p=document.createElement('span');p.className='plus';p.textContent='\u2212';p.setAttribute('aria-label','minus');tray.append(p);}
  const b=document.createElement('button');b.type='button';b.className='tile';b.textContent=v;b.dataset.i=i;b.setAttribute('aria-label',`Number ${v}, tap to place`);b.onclick=()=>{if(suppress)return;tapMove(i);};b.onpointerdown=e=>startDrag(e,i,b);tray.append(b);});
 if(!tray.children.length){tray.textContent='\u2191';tray.classList.add('arrow');}else tray.classList.remove('arrow');
 const cols=[];for(let k=m.maxd-1;k>=0;k--)cols.push(k);
 const act=k=>m.cur!==null&&k===m.cur&&!pend?' act':'';
 let h='';
 const handShow=m.placed&&!tapUsed&&!isLocked&&m.maxd>=2;
 // lowered-digit row
 h+=`<div class="row cr"><div class="sg"></div><div class="cells">`+cols.map(k=>{
  let inner='';
  if(lowVal[k]!==undefined)inner=`<div class="cfix">${lowVal[k]}</div>`;
  else if(handShow&&k===1)inner=`<span class="hand" aria-hidden="true">\uD83D\uDC47</span>`;
  else if(pend&&pend.t===k&&pend.stage==='low')inner=`<input class="cbox" id="inLow" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="New top digit">`;
  return `<div class="c" style="height:44px">${inner}</div>`;}).join('')+`</div></div>`;
 // number rows
 const topRow=()=>{
  const empty=m.top===null;
  const cells=cols.map(k=>{
   let pre='';
   if(!empty&&loan[k+1]){
    if(tenDone[k])pre=`<span class="pb${loan[k]?' st':''}">1</span>`;
    else if(pend&&pend.t===k+1&&pend.stage==='ten')pre=`<input class="pbi" id="inTen" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="One ten">`;}
   const d=empty?null:dig(m.top,k);
   const tappable=!empty&&d!==null&&k>=1&&!loan[k]&&!pend&&m.cur!==null&&ans[k-1]===undefined;
   const dg=d===null?'':`<span class="dg${loan[k]?' strike':''}${tappable?' tap':''}${nudge&&k===m.allowed?' nudge':''}${wigCol===k?' wig':''}" data-col="${k}">${d}</span>`;
   return `<div class="c${act(k)}">${d===null?'':`<span class="num${loan[k]?' strike':''}">${pre}${dg}</span>`}</div>`;}).join('');
  const attrs=empty||m.placed?'':` role="button" tabindex="0" aria-label="${m.top}, drag to move or press Enter to take out"`;
  return `<div class="row top"><div class="sg"></div><div class="cells slot ${empty?'empty':''}${wigSlot==='top'?' wig':''}" data-drop="top" data-slot="top"${attrs}>${cells}</div></div>`;};
 const botRow=()=>{
  const empty=m.bot===null;
  const cells=cols.map(k=>`<div class="c${act(k)}">${empty?'':(dig(m.bot,k)??'')}</div>`).join('');
  const attrs=empty||m.placed?'':` role="button" tabindex="0" aria-label="${m.bot}, drag to move or press Enter to take out"`;
  return `<div class="row bot"><div class="sg">\u2212</div><div class="cells slot ${empty?'empty':''}${wigSlot==='bottom'?' wig':''}" data-drop="bottom" data-slot="bottom"${attrs}>${cells}</div></div>`;};
 h+=topRow()+botRow();
 if(m.placed){
  h+=`<div class="row ar"><div class="sg"></div><div class="cells">`+cols.map(k=>{
   let inner='';
   if(ans[k]!==undefined)inner=`<div class="afix">${ans[k]}</div>`;
   else if(k===m.cur&&!pend)inner=`<input class="abox" id="inAns" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Answer">`;
   else if(k<m.resLen)inner=`<div class="afix wait"></div>`;
   return `<div class="c">${inner}</div>`;}).join('')+`</div></div>`;
 }
 $('frame').innerHTML=h;
 if(finished){$('msg').className='msg good';$('msg').textContent=`\u2713 Correct! ${m.top} \u2212 ${m.bot} = ${m.top-m.bot}. Great work!`;$('help').textContent='';}
 else{if($('msg').classList.contains('good')){$('msg').className='msg';$('msg').textContent='';}
  $('help').textContent=!m.placed?'':pend?(pend.stage==='low'?'Write the new top digit in the small box.':'Write the ten you moved over.'):'Subtract this column. Write the answer below the line.';}
 const ia=$('inAns'),il=$('inLow'),it=$('inTen');
 if(ia){ia.oninput=()=>onAns(ia,m);ia.focus();}
 if(il){il.oninput=()=>onLow(il,m);il.focus();}
 if(it){it.oninput=()=>onTen(it,m);it.focus();}
 document.querySelectorAll('#frame .dg[data-col]').forEach(el=>{el.onclick=ev=>{ev.stopPropagation();onTapDigit(+el.dataset.col,m);};});
 if(!isLocked&&!m.placed)document.querySelectorAll('#frame .slot[data-slot]').forEach(el=>{
  const w=el.dataset.slot,i=slotIdx(w);if(i<0)return;
  el.onpointerdown=e=>startDrag(e,i,el);
  el.onclick=()=>{if(suppress||m.placed)return;place[i]='stage';render();};
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place[i]='stage';render();}};});
 nudge=false;wigSlot=null;wigCol=null;
}
function setMsg(t){$('msg').className='msg';$('msg').textContent=t;}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function onTapDigit(col,m){
 tapUsed=true;
 if(pend||m.cur===null)return;
 if(m.need&&col===m.allowed){loan[col]=true;pend={t:col,stage:'low'};setMsg('');render();return;}
 wigCol=col;setMsg('');render();
}
function onAns(el,m){
 tapUsed=true;
 const v=el.value.replace(/\D/g,'');if(v===''){el.value='';return;}
 if(m.need){el.value='';nudge=true;setMsg('');render();return;}
 const want=m.e(m.cur)-m.b(m.cur);
 if(+v===want){ans[m.cur]=want;setMsg('');render();return;}
 el.value='';shake(el);setMsg(`Not quite. ${m.e(m.cur)} \u2212 ${m.b(m.cur)} = ?`);
}
function onLow(el,m){
 const v=el.value.replace(/\D/g,'');if(v===''){el.value='';return;}
 const t=pend.t,want=m.e(t);
 if(+v===want){lowVal[t]=want;pend.stage='ten';setMsg('');render();return;}
 el.value='';shake(el);setMsg(`Take away one ten: ${want+1} \u2212 1 = ?`);
}
function onTen(el,m){
 const v=el.value.replace(/\D/g,'');if(v===''){el.value='';return;}
 if(+v===1){tenDone[pend.t-1]=true;pend=null;setMsg('');render();return;}
 el.value='';shake(el);setMsg('You moved 1 ten. Write 1.');
}
function validTop(p){return [0,1].every(j=>!(p[j]==='top'&&nums[j]<nums[1-j])&&!(p[j]==='bottom'&&nums[j]>nums[1-j]));}
function tapMove(i){place[i]=nums[i]>nums[1-i]?'top':'bottom';render();}
function moveTo(i,target){
 const p=place.slice();
 if(target!=='stage'){const j=p.findIndex((x,n)=>x===target&&n!==i);if(j>=0)p[j]=p[i];}
 p[i]=target;
 if(!validTop(p)){wigSlot=target==='stage'?null:target;render();return;}
 place=p;render();
}
function startDrag(e,i,src){
 if(e.button>0||locked())return;
 const sx=e.clientX,sy=e.clientY;let ghost=null;
 const zones=()=>[...document.querySelectorAll('[data-drop]')].filter(z=>!z.closest('[hidden]'));
 const hit=(z,x,y)=>{const r=z.getBoundingClientRect();return x>=r.left-8&&x<=r.right+8&&y>=r.top-8&&y<=r.bottom+8;};
 const mv=ev=>{
  if(!ghost){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;
   ghost=document.createElement('div');ghost.className='tile ghost';ghost.textContent=nums[i];document.body.append(ghost);src.style.opacity='.3';}
  ghost.style.left=ev.clientX-ghost.offsetWidth/2+'px';ghost.style.top=ev.clientY-ghost.offsetHeight/2+'px';
  zones().forEach(z=>z.classList.toggle('over',hit(z,ev.clientX,ev.clientY)));};
 const up=ev=>{
  window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
  const zs=zones();zs.forEach(z=>z.classList.remove('over'));
  if(ghost){ghost.remove();src.style.opacity='';suppress=true;setTimeout(()=>suppress=false,0);
   if(ev.type==='pointerup'){const z=zs.find(z=>hit(z,ev.clientX,ev.clientY));if(z)moveTo(i,z.dataset.drop);}}};
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
const needsRegroup=(a,b)=>{let x=a,y=b;while(x>0||y>0){if(x%10<y%10)return true;x=Math.floor(x/10);y=Math.floor(y/10);}return false;};
function newProblem(){
 const r=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
 let top,bot;
 if(Math.random()<.2){
  do{top=r(2,9)*100+r(0,8);bot=Math.random()<.5?r(10,99):r(100,top-1);}while(!(bot<top&&bot%10>top%10));
 }else{
  const wantReg=Math.random()<.85;
  do{const a=r(10,Math.random()<.5?99:999),b=r(10,Math.random()<.5?99:999);top=Math.max(a,b);bot=Math.min(a,b);}
  while(top===bot||(wantReg&&!needsRegroup(top,bot)));
 }
 nums=Math.random()<.5?[top,bot]:[bot,top];
 tapUsed=false;place=['stage','stage'];ans=[];loan={};lowVal={};tenDone={};pend=null;$('msg').textContent='';render();
}
$('next').onclick=newProblem;
newProblem();
})();
</script></body></html>
